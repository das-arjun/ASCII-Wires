<svg fill="none" viewBox="0 0 400 50" width="400" height="50" xmlns="http://w3.org">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://w3.org">
      <style>
        .typewriter {
          font-family: monospace;
          color: #333;
          overflow: hidden;
          border-right: 2px solid orange;
          white-space: nowrap;
          animation: typing 3.5s steps(20, end) infinite, blink .75s step-end infinite;
          width: 0;
        }
        @keyframes typing { from { width: 0 } to { width: 170px } }
        @keyframes blink { from, to { border-color: transparent } 50% { border-color: orange } }
      </style>
      <h1 class="typewriter">Hello, World!</h1>
    </div>
  </foreignObject>
</svg>
